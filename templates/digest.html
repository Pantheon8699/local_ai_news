<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Morning Brief — $date_human</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#12203a">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morning Brief">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b1220;
    --card: #141f34;
    --accent: #e8871e;
    --text: #e8edf5;
    --text-dim: #9aa8bf;
    --border: #223050;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    padding-bottom: 3rem;
  }
  header {
    padding: 1.75rem 1.25rem 1.25rem;
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    margin: 0 0 0.15rem;
    font-size: 1.4rem;
    letter-spacing: -0.01em;
  }
  header .subtitle {
    color: var(--text-dim);
    font-size: 0.9rem;
    text-transform: capitalize;
  }
  nav.archive {
    padding: 0.75rem 1.25rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    white-space: nowrap;
  }
  nav.archive a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 0.82rem;
    padding: 0.3rem 0.7rem;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  nav.archive a.current {
    color: var(--bg);
    background: var(--accent);
    border-color: var(--accent);
    font-weight: 600;
  }
  main {
    padding: 1.25rem;
    max-width: 720px;
    margin: 0 auto;
  }
  section.category {
    margin-bottom: 2rem;
  }
  section.category h2 {
    font-size: 1.05rem;
    margin: 0 0 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid var(--accent);
    display: inline-block;
  }
  section.category ul {
    margin: 0;
    padding-left: 1.1rem;
  }
  section.category li {
    margin-bottom: 0.7rem;
    font-size: 0.97rem;
  }
  section.category li strong { color: var(--accent); }
  section.category li details { margin: -0.1rem 0 0.7rem; }
  section.category li details > summary {
    list-style: none;
    cursor: pointer;
    font-size: 0.97rem;
    padding-right: 1.1rem;
    position: relative;
  }
  section.category li details > summary::-webkit-details-marker { display: none; }
  section.category li details > summary::after {
    content: "▸";
    position: absolute;
    right: 0;
    top: 0.05rem;
    color: var(--accent);
    font-size: 0.75rem;
    transition: transform 0.15s ease;
  }
  section.category li details[open] > summary::after { transform: rotate(90deg); }
  section.category li details[open] > summary { margin-bottom: 0.55rem; }
  .sources {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
    padding: 0.15rem 0 0.15rem 0.85rem;
    border-left: 2px solid var(--border);
  }
  .source-item .source-title {
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.3rem;
  }
  .source-item .source-detail {
    margin: 0 0 0.4rem;
    font-size: 0.88rem;
    line-height: 1.55;
    color: var(--text);
  }
  .source-item .source-link {
    font-size: 0.78rem;
    color: var(--accent);
    text-decoration: none;
  }
  .source-item .source-link:hover { text-decoration: underline; }
  details.category-sources {
    margin-top: 0.9rem;
    padding-top: 0.7rem;
    border-top: 1px dashed var(--border);
  }
  details.category-sources > summary {
    list-style: none;
    cursor: pointer;
    font-size: 0.82rem;
    color: var(--text-dim);
    position: relative;
    padding-right: 1.1rem;
  }
  details.category-sources > summary::-webkit-details-marker { display: none; }
  details.category-sources > summary::after {
    content: "▸";
    position: absolute;
    right: 0;
    top: 0.1rem;
    font-size: 0.7rem;
    transition: transform 0.15s ease;
  }
  details.category-sources[open] > summary::after { transform: rotate(90deg); }
  details.category-sources[open] > summary { margin-bottom: 0.6rem; }
  details.category-sources .sources { border-left-color: var(--border); }
  .lean {
    font-size: 0.68rem;
    font-weight: 600;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0 0.3rem;
    vertical-align: 0.08rem;
  }
  .vote { display: flex; gap: 0.4rem; margin: -0.35rem 0 0.2rem; }
  .vote button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.1rem 0.55rem;
    font-size: 0.8rem;
    cursor: pointer;
    opacity: 0.45;
  }
  .vote button.on { opacity: 1; border-color: var(--accent); }
  .missing-note {
    margin: 1.5rem 1.25rem 0;
    padding: 0.85rem 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  footer {
    margin-top: 2.5rem;
    padding: 1rem 1.25rem;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.78rem;
  }
</style>
</head>
<body>
<header>
  <h1>Morning Brief</h1>
  <div class="subtitle">$date_human</div>
</header>
$archive_nav_html
<main>
$sections_html
</main>
$missing_categories_html
<footer>
  Generato localmente il $generated_at &middot; nessun servizio cloud coinvolto
</footer>
<script>
// Like/dislike on each bullet -> POST /api/vote (functions/api/vote.js).
// The pipeline reads the votes back every morning (core/interest.py).
(function () {
  var votes = JSON.parse(localStorage.getItem("votes") || "{}");
  function paint(li) {
    var v = votes[JSON.parse(li.dataset.urls)[0]];
    li.querySelectorAll(".vote button").forEach(function (b) {
      b.classList.toggle("on", Number(b.dataset.v) === v);
    });
  }
  document.querySelectorAll("li[data-urls]").forEach(paint);
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".vote button");
    if (!b) return;
    var li = b.closest("li"), urls = JSON.parse(li.dataset.urls), v = Number(b.dataset.v);
    var key = localStorage.getItem("voteKey") || prompt("Chiave per votare (votes.key in config.yaml):");
    if (!key) return;
    fetch("/api/vote", {
      method: "POST",
      headers: {"x-key": key, "content-type": "application/json"},
      body: JSON.stringify({urls: urls, v: v})
    }).then(function (r) {
      if (r.status === 401) { localStorage.removeItem("voteKey"); alert("Chiave errata."); return; }
      if (!r.ok) throw new Error(r.status);
      localStorage.setItem("voteKey", key);
      urls.forEach(function (u) { votes[u] = v; });
      localStorage.setItem("votes", JSON.stringify(votes));
      paint(li);
    }).catch(function () { alert("Voto non salvato."); });
  });
})();
</script>
</body>
</html>
